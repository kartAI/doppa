services:
  setup-framework:
    container_name: setup-framework
    env_file:
      - .env
    build:
      context: .
      dockerfile: .docker/Setup.Dockerfile
    image: setup-framework:latest
    command: python benchmark_runner.py --script-id setup-framework --benchmark-run 1 --run-id ABCDEF

  container-orchestrator:
    env_file:
      - .env
    build:
      context: .
      dockerfile: .docker/Orchestrator.Dockerfile
    image: container-orchestrator:latest
    command: python -m main

  # =================================================================
  # RQ1 — Single-machine query benchmarks
  # One service per (query_type, engine). Dataset size is a runtime
  # arg passed by main.py per experiment; the same image serves all
  # size tiers.
  # =================================================================

  point-in-polygon-lookup-duckdb:
    env_file:
      - .env
    build:
      context: .
      dockerfile: .docker/Query.Dockerfile
    image: point-in-polygon-lookup-duckdb:latest
    command: python benchmark_runner.py --script-id point-in-polygon-lookup-duckdb --benchmark-run 1 --run-id ABCDEF

