  # ==================================================================
  # RQ2 — National-scale spatial join (37 experiments)
  # Single-node: DuckDB + PostGIS at small/medium/large (paired).
  # Sedona: 3 strategies × variable worker counts × 3 sizes, unpaired
  # (each provisions its own cluster). The `default` strategy is the
  # apples-to-apples baseline against which `broadcast` and
  # `partitioned` are compared. The 2-node row is omitted at small
  # for `broadcast` and `partitioned` (weakly differentiated from
  # `default`); the freed cells fund the 12-/16-node extension of the
  # scaling curve at large.
  # ==================================================================

  # ---- single-node ----
  - id: national-scale-spatial-join-duckdb-small
