experiments:
  # ==================================================================
  # RQ1 — Single-machine query benchmarks (15 experiments)
  # 3 query types × (DuckDB + PostGIS at small/large
  #                  + Shapefile at small)
  # Pairing: at `small` all three engines pair (3-way); at `large`
  # DuckDB and PostGIS pair (2-way). Shapefile only runs at small.
  # Medium tier and attribute-spatial-compound-filter were removed
  # in the matrix reshape (issue #281); the freed cells are reinvested
  # in RQ2.
  # ==================================================================

  # ---- point-in-polygon-lookup ----
  - id: point-in-polygon-lookup-duckdb-small
    image: doppaacr.azurecr.io/point-in-polygon-lookup-duckdb:latest
    cpu: 3
    memory_gb: 8
    dataset_size: small
    related_script_ids:
      - point-in-polygon-lookup-postgis-small
      - point-in-polygon-lookup-local-small

  - id: point-in-polygon-lookup-postgis-small
    image: doppaacr.azurecr.io/point-in-polygon-lookup-postgis:latest
    cpu: 3
    memory_gb: 8
    dataset_size: small
